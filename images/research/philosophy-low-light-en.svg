<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" style="display:block;width:100%;height:auto" role="img" aria-labelledby="title desc"><title id="title">How can we explain delayed heading under low light?</title><desc id="desc">Data analysis and physiological hypotheses inform experiments and model testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7ba68c" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="#f9fbf8"/><g font-family="Arial, Malgun Gothic, sans-serif"><text x="80" y="75" fill="#3e7657" font-size="19" font-weight="700" text-anchor="start"><tspan x="80" dy="0">RESEARCH EXAMPLE</tspan></text><text x="80" y="138" fill="#173a4c" font-size="38" font-weight="750" text-anchor="start"><tspan x="80" dy="0">How can we explain delayed heading under low light?</tspan></text><path d="M230 460C350 460 350 300 540 300" fill="none" stroke="#9bbcab" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 460C350 460 350 635 540 635" fill="none" stroke="#9bbcab" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 300C770 300 760 460 1000 460" fill="none" stroke="#9bbcab" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 635C770 635 760 460 1000 460" fill="none" stroke="#9bbcab" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000 460H1390" fill="none" stroke="#9bbcab" stroke-width="3" marker-end="url(#arrow)"/><circle cx="210" cy="460" r="85" fill="#edf3f6" stroke="#c5d9ce" stroke-width="2"/><circle cx="540" cy="300" r="65" fill="#e8f1f8" stroke="#c5d9ce" stroke-width="2"/><circle cx="540" cy="635" r="65" fill="#e9f4ec" stroke="#c5d9ce" stroke-width="2"/><circle cx="1000" cy="460" r="70" fill="#eef5ed" stroke="#c5d9ce" stroke-width="2"/><circle cx="1390" cy="460" r="70" fill="#f6f1e7" stroke="#c5d9ce" stroke-width="2"/><text x="210" y="451" fill="#294c5f" font-size="30" font-weight="700" text-anchor="middle"><tspan x="210" dy="0">Delayed</tspan><tspan x="210" dy="42">heading</tspan></text><text x="210" y="600" fill="#607987" font-size="23" font-weight="500" text-anchor="middle"><tspan x="210" dy="0">Under low light</tspan></text><g transform="translate(506.5 266.5) scale(1.046875)" fill="none" stroke="#397b9b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15L48 12L51 46L16 50ZM15 15L51 46M48 12L16 50"></path><circle cx="15" cy="15" r="5"></circle><circle cx="48" cy="12" r="5"></circle><circle cx="51" cy="46" r="5"></circle><circle cx="16" cy="50" r="5"></circle><circle cx="32" cy="31" r="6"></circle></g><text x="540" y="405" fill="#2b6a8b" font-size="27" font-weight="700" text-anchor="middle"><tspan x="540" dy="0">AI and data analysis</tspan></text><text x="540" y="449" fill="#607987" font-size="22" font-weight="500" text-anchor="middle"><tspan x="540" dy="0">Patterns in radiation</tspan><tspan x="540" dy="30.799999999999997">and heading dates</tspan></text><g transform="translate(505 601) scale(.9)" fill="none" stroke="#397e55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 61V29M40 40C17 42 12 25 13 14C34 13 41 25 40 40ZM40 30C40 12 53 7 67 9C68 23 57 34 40 30ZM40 61L26 68M40 61L54 68M40 61V69"></path></g><text x="540" y="743" fill="#286341" font-size="27" font-weight="700" text-anchor="middle"><tspan x="540" dy="0">Physiological hypotheses</tspan></text><text x="540" y="785" fill="#607987" font-size="21" font-weight="500" text-anchor="middle"><tspan x="540" dy="0">Carbon status? Light signaling?</tspan><tspan x="540" dy="29.4">Temperature effects?</tspan></text><g transform="translate(965.5 425.5) scale(1.078125)" fill="none" stroke="#397e55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7H42M27 7V27L14 48Q10 58 21 58H43Q54 58 50 48L37 27V7M22 40H42"/></g><text x="1000" y="575" fill="#286341" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1000" dy="0">Test the hypotheses</tspan></text><text x="1000" y="621" fill="#607987" font-size="21" font-weight="500" text-anchor="middle"><tspan x="1000" dy="0">Separate light and temperature effects</tspan><tspan x="1000" dy="29.4">Measure physiological responses</tspan></text><g transform="translate(1355.5 425.5) scale(1.078125)" fill="none" stroke="#9b7e45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8V54H57M17 46C30 45 27 19 52 16M17 47C34 45 32 30 52 25M20 55V59M37 55V59M54 55V59"></path><circle cx="28" cy="38" r="3"></circle><circle cx="40" cy="23" r="3"></circle><circle cx="52" cy="16" r="3"></circle></g><text x="1390" y="575" fill="#7c6539" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1390" dy="0">Improve the model</tspan></text><text x="1390" y="621" fill="#607987" font-size="21" font-weight="500" text-anchor="middle"><tspan x="1390" dy="0">Test in new environments</tspan></text><path d="M80 875H1520" stroke="#d8e5dc" stroke-width="1.5"/><text x="800" y="923" fill="#607987" font-size="23" font-weight="500" text-anchor="middle"><tspan x="800" dy="0">These are hypotheses to test. The diagram does not identify a proven cause.</tspan></text></g></svg>