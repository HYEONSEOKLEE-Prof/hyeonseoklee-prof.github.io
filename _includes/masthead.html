{% include base_path %}

<div class="masthead" style="background:#ffffff!important;border-bottom:1px solid #d8e0e2!important;box-shadow:0 6px 18px rgba(7,26,43,.08)!important;animation:none!important;opacity:1!important;visibility:visible!important;">
  <div class="masthead__inner-wrap" style="background:#ffffff!important;">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" style="background:#ffffff!important;">
        <button style="color:#071a2b!important;"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist" style="background:transparent!important;"><a href="{{ base_path }}/" style="color:#071a2b!important;opacity:1!important;">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item" style="background:transparent!important;"><a href="{{ domain }}{{ link.url }}" style="color:#071a2b!important;opacity:1!important;">{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail" style="display:none!important;" aria-hidden="true">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
