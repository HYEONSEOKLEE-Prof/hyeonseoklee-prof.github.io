name: Recover research image assets

on:
  push:
    paths:
      - '.github/workflows/recover-research-images.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct split WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/research/recovered

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import math
          import struct

          groups = {
              'recovered-a.webp': [
                  'images/research/source-04.webp',
                  'images/research/source-05.webp',
                  'images/research/source-06.webp',
                  'images/research/source-07.webp',
              ],
              'recovered-b.webp': [
                  'images/research/source-08.webp',
                  'images/research/source-09.webp',
                  'images/research/source-10.webp',
                  'images/research/source-11.webp',
              ],
          }

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')

          for out_name, parts in groups.items():
              text = ''.join(Path(p).read_text(encoding='ascii', errors='ignore') for p in parts)
              text = ''.join(ch for ch in text if ch in alphabet)

              # Decode enough bytes to read the RIFF-declared WebP file size.
              head = base64.b64decode(text[:64] + '===')
              if len(head) < 12 or head[:4] != b'RIFF' or head[8:12] != b'WEBP':
                  raise SystemExit(f'{out_name}: reconstructed stream does not start with RIFF/WEBP')

              total_bytes = struct.unpack('<I', head[4:8])[0] + 8
              required_chars = 4 * math.ceil(total_bytes / 3)
              payload = text[:required_chars]
              payload += '=' * ((4 - len(payload) % 4) % 4)
              data = base64.b64decode(payload)
              data = data[:total_bytes]

              if len(data) != total_bytes or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{out_name}: invalid reconstructed WebP ({len(data)} / {total_bytes} bytes)')

              out = Path('images/research/recovered') / out_name
              out.write_bytes(data)
              print(f'{out}: {len(data)} bytes, valid RIFF/WEBP container')
          PY

          file images/research/recovered/recovered-a.webp
          file images/research/recovered/recovered-b.webp

      - name: Commit recovered assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/research/recovered/recovered-a.webp images/research/recovered/recovered-b.webp
          if git diff --cached --quiet; then
            echo 'No recovered asset changes to commit.'
            exit 0
          fi
          git commit -m 'Recover research image assets'
          git push origin HEAD:master
